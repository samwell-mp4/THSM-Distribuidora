<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Produtos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand h1 i { color: #3b82f6; }
    .brand p { font-size: 0.78rem; color: #64748b; margin-top: 0.15rem; }
    .header-actions { display: flex; gap: 0.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; }
    .btn-primary { background: #2563eb; color: #ffffff; border-color: #1d4ed8; }
    .btn-primary:hover { background: #1d4ed8; color: #ffffff; }
    
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
      flex: 1;
    }
    .controls {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .search-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box i { position: absolute; left: 0.85rem; color: #94a3b8; }
    .search-input {
      width: 100%;
      padding: 0.6rem 2.2rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .sort-select {
      padding: 0.6rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.82rem;
      background: #ffffff;
      outline: none;
      cursor: pointer;
    }
    .cat-pills {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }
    .cat-pill {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 600;
      border: 1px solid #e2e8f0;
      background: #f1f5f9;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-pill.active { background: #2563eb; color: #ffffff; border-color: #1d4ed8; }
    
    .meta-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: #64748b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.15rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.07);
      border-color: #cbd5e1;
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-img i.fallback { font-size: 2.2rem; color: #94a3b8; }
    .card-badge {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      background: rgba(255, 255, 255, 0.95);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .card-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.4rem;
    }
    .card-price-row {
      margin-top: auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-top: 0.4rem;
      border-top: 1px solid #f1f5f9;
    }
    .card-price-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .card-price { font-size: 1.15rem; font-weight: 800; color: #2563eb; }
    
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #ffffff;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
    }
    .modal-img-wrap {
      width: 100%;
      max-height: 360px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-img-wrap img { width: 100%; max-height: 360px; object-fit: contain; }
    .modal-body { padding: 1.25rem; }
    .modal-cat {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.75rem; }
    .modal-price-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-price-box span { font-size: 0.78rem; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .modal-price-box strong { font-size: 1.4rem; color: #2563eb; font-weight: 900; }
    
    footer {
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 1.25rem;
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { background: #fff !important; color: #000 !important; }
      .header-actions, .controls, .modal-backdrop, footer, .no-print { display: none !important; }
      header { position: static !important; border-bottom: 2px solid #000 !important; padding-bottom: 5mm !important; }
      .header-inner { justify-content: center !important; text-align: center !important; }
      .grid { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 4mm !important; }
      .card { border: 1px solid #ccc !important; page-break-inside: avoid; break-inside: avoid; box-shadow: none !important; }
      .card-img { max-height: 48mm !important; }
      .card-title { font-size: 0.78rem !important; }
      .card-price { font-size: 0.95rem !important; color: #000 !important; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.65rem; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1 id="pageTitle"><i class="fa-solid fa-box-open"></i> Catálogo de Produtos</h1>
        <p>Confira nossos produtos e valores atualizados</p>
      </div>
      <div class="header-actions no-print">
        <button class="btn" onclick="shareCatalog()"><i class="fa-solid fa-share-nodes"></i> Compartilhar</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Salvar PDF / Imprimir</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="controls no-print">
      <div class="search-row">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar produto por nome ou categoria..." oninput="render()" />
        </div>
        <select id="sortSelect" class="sort-select" onchange="render()">
          <option value="nome-asc">Nome (A - Z)</option>
          <option value="nome-desc">Nome (Z - A)</option>
          <option value="preco-asc">Menor Preço</option>
          <option value="preco-desc">Maior Preço</option>
        </select>
      </div>
      <div class="cat-pills" id="catPills"></div>
    </div>

    <div class="meta-bar">
      <span>Mostrando <strong id="productCount">0</strong> produtos</span>
      <span id="activeCatLabel"></span>
    </div>

    <div class="grid" id="productGrid"></div>
  </div>

  <footer class="no-print">
    <span>Catálogo de Produtos &bull; Preços e disponibilidade sujeitos a alteração</span>
  </footer>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
      <div class="modal-img-wrap" id="modalImgWrap"></div>
      <div class="modal-body">
        <span class="modal-cat" id="modalCat"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price-box">
          <span>Valor Unitário</span>
          <strong id="modalPrice"></strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];
    let currentCat = 'TODOS';

    function formatPreco(v) {
      return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
    }

    function formatImageUrl(url) {
      if (!url) return '';
      if (url.includes('minharota.net/controller/fotos/')) {
        const fn = url.substring(url.lastIndexOf('/') + 1);
        return '/fotos/' + fn;
      }
      return url;
    }

    function shareCatalog() {
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => alert('Link copiado com sucesso!'));
      } else {
        prompt('Copie o link abaixo:', url);
      }
    }

    function setCategory(cat) {
      currentCat = cat;
      render();
    }

    function openModal(p) {
      document.getElementById('modalTitle').textContent = p.nome;
      document.getElementById('modalCat').textContent = p.categoria || 'Geral';
      document.getElementById('modalPrice').textContent = formatPreco(p.preco);
      
      const wrap = document.getElementById('modalImgWrap');
      if (p.imagem) {
        wrap.innerHTML = '<img src="' + formatImageUrl(p.imagem) + '" alt="' + p.nome + '" />';
      } else {
        wrap.innerHTML = '<i class="fa-solid fa-image fallback" style="font-size:4rem;color:#94a3b8;padding:2rem;"></i>';
      }
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function render() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      let filtered = allProducts.filter(p => {
        if (!p || p.deleted) return false;
        if (currentCat !== 'TODOS' && p.categoria !== currentCat) return false;
        if (q) {
          const mNome = (p.nome || '').toLowerCase().includes(q);
          const mCat = (p.categoria || '').toLowerCase().includes(q);
          if (!mNome && !mCat) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sort === 'nome-asc') return (a.nome || '').localeCompare(b.nome || '', 'pt-BR');
        if (sort === 'nome-desc') return (b.nome || '').localeCompare(a.nome || '', 'pt-BR');
        if (sort === 'preco-asc') return (Number(a.preco) || 0) - (Number(b.preco) || 0);
        if (sort === 'preco-desc') return (Number(b.preco) || 0) - (Number(a.preco) || 0);
        return 0;
      });

      document.getElementById('productCount').textContent = filtered.length;
      document.getElementById('activeCatLabel').textContent = currentCat !== 'TODOS' ? 'Categoria: ' + currentCat : '';

      // Render pills
      const cats = ['TODOS', ...new Set(allProducts.map(p => p.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      const pillsContainer = document.getElementById('catPills');
      pillsContainer.innerHTML = cats.map(c => 
        '<button class="cat-pill ' + (c === currentCat ? 'active' : '') + '" onclick="setCategory(\'' + c + '\')">' + c + '</button>'
      ).join('');

      // Render grid
      const grid = document.getElementById('productGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 3rem 1rem; color: #64748b;"><i class="fa-solid fa-box-open" style="font-size:2.5rem; color:#cbd5e1; margin-bottom:0.75rem;"></i><p>Nenhum produto encontrado com esses filtros.</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const imgTag = p.imagem
          ? '<img src="' + formatImageUrl(p.imagem) + '" alt="' + p.nome + '" loading="lazy" onerror="this.style.display=\'none\'" />'
          : '<i class="fa-solid fa-image fallback"></i>';
        const catBadge = p.categoria ? '<span class="card-badge">' + p.categoria + '</span>' : '';
        return `
          <div class="card" onclick='openModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
            <div class="card-img">
              ${imgTag}
              ${catBadge}
            </div>
            <div class="card-body">
              <h3 class="card-title">${p.nome}</h3>
              <div class="card-price-row">
                <span class="card-price-label">Preço</span>
                <span class="card-price">${formatPreco(p.preco)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function init() {
      // 1. Try localStorage
      try {
        const cached = localStorage.getItem('thsm_cached_produtos');
        if (cached) {
          allProducts = JSON.parse(cached).filter(p => !p.deleted && p.id && p.nome);
          render();
        }
      } catch (e) {}

      // 2. Fetch fresh from API
      try {
        const res = await fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'select', table: 'produtos' })
        });
        if (res.ok) {
          const json = await res.json();
          if (json.data && Array.isArray(json.data) && json.data.length > 0) {
            allProducts = json.data.filter(p => !p.deleted && p.id && p.nome);
            try { localStorage.setItem('thsm_cached_produtos', JSON.stringify(allProducts)); } catch {}
            render();
          }
        }
      } catch (e) {
        console.warn('API fetch fallback to cache:', e);
      }
    }

    init();
  </script>
</body>
</html>
